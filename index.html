<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crooks Peak — XR, Robotics and Software Studio</title>
    <meta name="description" content="Crooks Peak — XR, Robotics and Software Studio">
    <link rel="icon" href="favicon.ico">
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-card: #111827;
            --border-subtle: rgba(255, 255, 255, 0.09);
            --accent: #ffc400;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            background-color: var(--bg-primary);
            background-image: radial-gradient(circle at 50% 35%, #172033 0%, var(--bg-primary) 70%);
            color: var(--text-primary);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 24px;
        }

        main {
            width: 100%;
            max-width: 540px;
            background: rgba(17, 24, 39, 0.75);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 56px 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
        }

        .logo-mark {
            width: clamp(88px, 22vw, 128px);
            height: auto;
            display: block;
        }

        .logo-title {
            width: clamp(180px, 48vw, 260px);
            height: auto;
            display: block;
        }

        .subtitle {
            font-size: clamp(1.05rem, 3.2vw, 1.35rem);
            font-weight: 500;
            letter-spacing: 0.03em;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .divider {
            width: 48px;
            height: 2px;
            background-color: var(--accent);
            opacity: 0.75;
            margin: 28px auto;
            border: none;
            border-radius: 1px;
        }

        .contact {
            font-size: clamp(0.95rem, 2.6vw, 1.05rem);
            color: var(--text-secondary);
            letter-spacing: 0.01em;
            word-break: break-word;
        }

        .contact a {
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid rgba(255, 196, 0, 0.5);
            padding-bottom: 2px;
            transition: color 0.15s ease, border-color 0.15s ease;
        }

        .contact a:hover,
        .contact a:focus {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
            }

            main {
                padding: 40px 24px;
            }

            .brand {
                gap: 16px;
                margin-bottom: 22px;
            }

            .divider {
                margin: 22px auto;
            }
        }
    </style>
</head>

<body>
    <main>
        <div class="brand">
            <img src="images/crooksPeak.svg" alt="Crooks Peak logo" class="logo-mark">
            <img src="images/crooksPeakTitle.svg" alt="Crooks Peak" class="logo-title">
        </div>

        <h1 class="subtitle">XR, Robotics and Software Studio</h1>

        <hr class="divider" aria-hidden="true">

        <p class="contact">
            Email: <a href="mailto:charlie@crookspeak.com">charlie@crookspeak.com</a>
        </p>
    </main>
</body>

</html>
